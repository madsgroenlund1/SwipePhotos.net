# XcodeGen spec — equivalent to tools/gen_xcodeproj.py.
#   brew install xcodegen && cd ios && xcodegen generate
name: SwipePhotos
options:
  bundleIdPrefix: net.swipephotos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SwipePhotos:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwipePhotos
        excludes: ["Resources/Info.plist", "Resources/SwipePhotos.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.swipephotos.app
        INFOPLIST_FILE: SwipePhotos/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SwipePhotos/Resources/SwipePhotos.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      storeKitConfiguration: SwipePhotos/Resources/Products.storekit
